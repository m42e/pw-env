name: Finalize macOS Notarization

on:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: finalize-notarization
  cancel-in-progress: false

jobs:
  finalize:
    name: Poll Apple notarization
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_NOTARIZATION_SECRETS_PRESENT: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Skip when notarization secrets are unavailable
        if: env.MACOS_NOTARIZATION_SECRETS_PRESENT != 'true'
        run: |
          echo "::notice title=Disabled::Apple notarization secrets not configured; skipping notarization finalization."
          echo "Apple notarization secrets not configured; skipping notarization finalization."

      - name: Poll pending macOS notarization submissions
        if: env.MACOS_NOTARIZATION_SECRETS_PRESENT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo '## macOS notarization poll' >> "$GITHUB_STEP_SUMMARY"

          repository_id=$(gh api "repos/$GH_REPO" --jq '.id')
          release_workflow_id=$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq '.id')
          artifacts_file="$RUNNER_TEMP/notarization-artifacts.txt"
          gh api "repos/$GH_REPO/actions/artifacts" --paginate \
            --jq '.artifacts[] | select((.expired | not) and (.name | startswith("notarization-"))) | @base64' \
            > "$artifacts_file"

          artifact_count=$(grep -c '.' "$artifacts_file" || true)
          total_count=0
          accepted_count=0
          pending_count=0
          failed_count=0
          skipped_count=0

          echo "Artifact prefix: notarization-"
          echo "Found $artifact_count pending notarization artifact(s)."
          echo "::notice title=Scan::Found $artifact_count pending notarization artifact(s) for prefix notarization-"
          printf '%s\n' "- Artifact prefix: notarization-" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Pending notarization artifacts found: $artifact_count" >> "$GITHUB_STEP_SUMMARY"

          if [ "$artifact_count" -eq 0 ]; then
            echo "::notice title=Done::No pending macOS notarization artifacts found."
            echo "No pending macOS notarization artifacts found."
            printf '%s\n' '- No pending notarization artifacts found.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          resolve_tag_commit() {
            local tag="$1"
            local ref_data object_type object_sha tag_data
            if ! ref_data=$(gh api "repos/$GH_REPO/git/ref/tags/$tag"); then
              return 1
            fi
            object_type=$(jq -r '.object.type // empty' <<< "$ref_data")
            object_sha=$(jq -r '.object.sha // empty' <<< "$ref_data")
            for _ in 1 2 3 4 5; do
              [ "$object_type" = "tag" ] || break
              if [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]] || \
                 ! tag_data=$(gh api "repos/$GH_REPO/git/tags/$object_sha"); then
                return 1
              fi
              object_type=$(jq -r '.object.type // empty' <<< "$tag_data")
              object_sha=$(jq -r '.object.sha // empty' <<< "$tag_data")
            done
            [ "$object_type" = "commit" ] || return 1
            printf '%s\n' "$object_sha"
          }

          while IFS= read -r encoded_artifact; do
            [ -n "$encoded_artifact" ] || continue

            total_count=$((total_count + 1))
            artifact_json=$(printf '%s' "$encoded_artifact" | base64 --decode)
            artifact_id=$(jq -r '.id' <<<"$artifact_json")
            artifact_name=$(jq -r '.name' <<<"$artifact_json")
            run_id=$(jq -r '.workflow_run.id // empty' <<<"$artifact_json")

            echo "Checking artifact $artifact_name (id=$artifact_id, run_id=${run_id:-none})"

            if [ -z "$run_id" ]; then
              echo "::warning title=Skipped::$artifact_name is missing workflow run information and will be skipped."
              echo "Artifact $artifact_name is missing workflow run information; skipping."
              printf '%s\n' "- Skipped $artifact_name because the source workflow run is unavailable." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::warning title=Skipped::$artifact_name has an invalid workflow run ID."
              printf '%s\n' "- Skipped $artifact_name because its workflow run ID was invalid." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            if ! source_run=$(gh api "repos/$GH_REPO/actions/runs/$run_id"); then
              echo "::warning title=Skipped::$artifact_name source workflow run could not be loaded."
              printf '%s\n' "- Skipped $artifact_name because its source run could not be loaded." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            artifact_run_branch=$(jq -r '.workflow_run.head_branch // empty' <<< "$artifact_json")
            artifact_run_sha=$(jq -r '.workflow_run.head_sha // empty' <<< "$artifact_json")
            if ! jq -e \
              --arg repository_id "$repository_id" \
              --arg workflow_id "$release_workflow_id" \
              --arg run_branch "$artifact_run_branch" \
              --arg run_sha "$artifact_run_sha" \
              '(.repository.id | tostring) == $repository_id and
               (.head_repository.id | tostring) == $repository_id and
               (.workflow_id | tostring) == $workflow_id and
               (.path | split("@")[0]) == ".github/workflows/release.yml" and
               .event == "push" and .status == "completed" and .conclusion == "success" and
               .head_branch == $run_branch and .head_sha == $run_sha and
               (.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
              <<< "$source_run" >/dev/null; then
              echo "::warning title=Skipped::$artifact_name did not come from a successful same-repository release tag run."
              printf '%s\n' "- Skipped $artifact_name because its source run was not an approved release run." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            source_tag=$(jq -r '.head_branch' <<< "$source_run")
            source_sha=$(jq -r '.head_sha' <<< "$source_run")
            if ! tag_object_sha=$(resolve_tag_commit "$source_tag") || \
               [ "$tag_object_sha" != "$source_sha" ]; then
              echo "::warning title=Skipped::$artifact_name source run SHA no longer matches tag $source_tag."
              printf '%s\n' "- Skipped $artifact_name because its source run SHA did not match the current tag." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            workdir=$(mktemp -d)
            artifact_dir="$workdir/artifact"
            mkdir -p "$artifact_dir"
            if ! gh run download "$run_id" -R "$GH_REPO" -n "$artifact_name" -D "$artifact_dir"; then
              echo "::warning title=Skipped::$artifact_name could not be downloaded from the approved release run."
              printf '%s\n' "- Skipped $artifact_name because it could not be downloaded." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              rm -rf "$workdir"
              continue
            fi

            metadata_files=()
            while IFS= read -r -d '' metadata_path; do
              metadata_files+=("$metadata_path")
            done < <(find "$artifact_dir" -type f -name '*.json' -print0)
            if [ "${#metadata_files[@]}" -ne 1 ]; then
              echo "::warning title=Skipped::$artifact_name did not contain exactly one metadata JSON file."
              printf '%s\n' "- Skipped $artifact_name because it did not contain exactly one metadata JSON file." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              rm -rf "$workdir"
              continue
            fi

            metadata_file=${metadata_files[0]}

            if ! jq -e 'type == "object"' "$metadata_file" >/dev/null; then
              echo "::warning title=Skipped::$artifact_name contains malformed metadata."
              printf '%s\n' "- Skipped $artifact_name because its metadata was malformed." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              rm -rf "$workdir"
              continue
            fi

            tag=$(jq -r '.tag // empty' "$metadata_file")
            metadata_ref=$(jq -r '.ref // empty' "$metadata_file")
            metadata_sha=$(jq -r '.commit_sha // empty' "$metadata_file")
            target=$(jq -r '.target // empty' "$metadata_file")
            binary=$(jq -r '.binary // empty' "$metadata_file")
            binary_sha256=$(jq -r '.binary_sha256 // empty' "$metadata_file")
            archive=$(jq -r '.archive // empty' "$metadata_file")
            archive_sha256=$(jq -r '.archive_sha256 // empty' "$metadata_file")
            asset_name=$(jq -r '.asset_name // empty' "$metadata_file")
            submission_id=$(jq -r '.submission_id // empty' "$metadata_file")
            submitted_at=$(jq -r '.submitted_at // "unknown"' "$metadata_file")

            case "$target" in
              x86_64-apple-darwin|aarch64-apple-darwin) ;;
              *)
                echo "::warning title=Skipped::$artifact_name has an unsupported notarization target."
                printf '%s\n' "- Skipped $artifact_name because its target was unsupported." >> "$GITHUB_STEP_SUMMARY"
                skipped_count=$((skipped_count + 1))
                rm -rf "$workdir"
                continue
                ;;
            esac

            expected_asset_name="pw-env-$source_tag-$target.tar.gz"
            if [ "$tag" != "$source_tag" ] || \
               [ "$metadata_ref" != "refs/tags/$source_tag" ] || \
               [ "$metadata_sha" != "$source_sha" ] || \
               [ "$artifact_name" != "notarization-$source_tag-$target" ] || \
               [ "$binary" != "pw-env" ] || [ "$archive" != "tar.gz" ] || \
               [[ ! "$binary_sha256" =~ ^[[:xdigit:]]{64}$ ]] || \
               [[ ! "$archive_sha256" =~ ^[[:xdigit:]]{64}$ ]] || \
               [ "$asset_name" != "$expected_asset_name" ] || \
               [[ ! "$submission_id" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
              echo "::warning title=Skipped::$artifact_name metadata did not match the trusted release record."
              printf '%s\n' "- Skipped $artifact_name because its metadata did not match the trusted release record." >> "$GITHUB_STEP_SUMMARY"
              skipped_count=$((skipped_count + 1))
              rm -rf "$workdir"
              continue
            fi

            checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            response_file="$workdir/${target}-notary-info.json"
            asset_dir="$workdir/${target}"
            package_dir="$asset_dir/package"
            asset_path="$asset_dir/$asset_name"
            binary_path="$package_dir/$binary"

            echo "Processing tag=$tag target=$target asset=$asset_name submission_id=$submission_id submitted_at=$submitted_at"

            if ! xcrun notarytool info "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json > "$response_file"; then
              echo "::warning title=Retry::$tag $target Apple status query failed; keeping artifact for retry."
              printf '%s\n' "- $tag $target: Apple status query failed; will retry." >> "$GITHUB_STEP_SUMMARY"
              failed_count=$((failed_count + 1))
              rm -rf "$workdir"
              continue
            fi

            if ! jq -e 'type == "object"' "$response_file" >/dev/null; then
              echo "::warning title=Retry::$tag $target Apple returned malformed status data; keeping artifact for retry."
              printf '%s\n' "- $tag $target: Apple returned malformed status data; will retry." >> "$GITHUB_STEP_SUMMARY"
              failed_count=$((failed_count + 1))
              rm -rf "$workdir"
              continue
            fi

            status=$(jq -r '.status // "Unknown"' "$response_file")
            status_summary=$(jq -r '.statusSummary // empty' "$response_file")
            echo "Apple status for $tag $target: $status"
            if [ -n "$status_summary" ]; then
              echo "Apple status summary: $status_summary"
            fi

            case "$status" in
              Accepted)
                echo "::notice title=Accepted::$tag $target accepted by Apple; updating release asset."
                echo "Notarization accepted for $tag $target; downloading release asset and stapling binary."
                mkdir -p "$package_dir"
                if ! gh release download "$tag" -R "$GH_REPO" --pattern "$asset_name" --dir "$asset_dir"; then
                  echo "::warning title=Failed::$tag $target release not found; deleting artifact."
                  echo "Release $tag not found for $artifact_name; deleting artifact."
                  printf '%s\n' "- $tag $target: release not found; artifact deleted." >> "$GITHUB_STEP_SUMMARY"
                  gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi

                actual_archive_sha256=$(shasum -a 256 "$asset_path" | awk '{print $1}')
                if [ "$actual_archive_sha256" != "$archive_sha256" ]; then
                  echo "::warning title=Failed::$tag $target release archive digest does not match the trusted release record."
                  printf '%s\n' "- $tag $target: release archive digest did not match; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi

                case "$archive" in
                  tar.gz)
                    if ! tar -xzf "$asset_path" -C "$package_dir"; then
                      echo "::warning title=Failed::$tag $target release archive could not be extracted."
                      printf '%s\n' "- $tag $target: release archive could not be extracted; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                      failed_count=$((failed_count + 1))
                      rm -rf "$workdir"
                      continue
                    fi
                    ;;
                  zip)
                    if ! ditto -x -k "$asset_path" "$package_dir"; then
                      echo "::warning title=Failed::$tag $target release archive could not be extracted."
                      printf '%s\n' "- $tag $target: release archive could not be extracted; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                      failed_count=$((failed_count + 1))
                      rm -rf "$workdir"
                      continue
                    fi
                    ;;
                  *)
                    echo "::warning title=Failed::$tag $target has unsupported archive format $archive."
                    echo "Unsupported archive format $archive for $artifact_name"
                    printf '%s\n' "- $tag $target: unsupported archive format $archive." >> "$GITHUB_STEP_SUMMARY"
                    gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                    failed_count=$((failed_count + 1))
                    rm -rf "$workdir"
                    continue
                    ;;
                esac

                if [ ! -f "$binary_path" ]; then
                  echo "::warning title=Failed::$tag $target packaged binary was missing after download."
                  echo "Packaged binary $binary_path is missing for $artifact_name"
                  printf '%s\n' "- $tag $target: packaged binary was missing after download." >> "$GITHUB_STEP_SUMMARY"
                  gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi

                actual_binary_sha256=$(shasum -a 256 "$binary_path" | awk '{print $1}')
                if [ "$actual_binary_sha256" != "$binary_sha256" ]; then
                  echo "::warning title=Failed::$tag $target package binary digest does not match the submitted binary."
                  printf '%s\n' "- $tag $target: package binary digest did not match the notarized binary; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi

                stapler_exit=0
                xcrun stapler staple "$binary_path" || stapler_exit=$?
                if [ "$stapler_exit" -eq 73 ]; then
                  # Error 73 means stapling is not supported for this file type.
                  # Standalone binaries (non-.app bundles) cannot be stapled; GateKeeper
                  # will verify the notarization online instead. This is not an error.
                  echo "::notice title=Accepted::$tag $target is a standalone binary; stapling not applicable (notarization verified online by GateKeeper)."
                  echo "Standalone binary $tag $target; skipping staple (Error 73 expected)."
                  printf '%s\n' "- $tag $target: notarization accepted; stapling skipped (standalone binary)." >> "$GITHUB_STEP_SUMMARY"
                  if ! gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"; then
                    echo "::warning title=Retry::$tag $target was accepted but its metadata artifact could not be removed."
                    printf '%s\n' "- $tag $target: accepted; metadata artifact cleanup will retry." >> "$GITHUB_STEP_SUMMARY"
                    failed_count=$((failed_count + 1))
                    rm -rf "$workdir"
                    continue
                  fi
                  accepted_count=$((accepted_count + 1))
                  rm -rf "$workdir"
                  continue
                elif [ "$stapler_exit" -ne 0 ]; then
                  echo "::warning title=Failed::$tag $target stapling failed with exit code $stapler_exit."
                  echo "Stapling failed for $tag $target with exit code $stapler_exit"
                  printf '%s\n' "- $tag $target: stapling failed with exit code $stapler_exit." >> "$GITHUB_STEP_SUMMARY"
                  gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                else
                  if ! xcrun stapler validate "$binary_path"; then
                    echo "::warning title=Failed::$tag $target stapled binary failed validation."
                    printf '%s\n' "- $tag $target: stapled binary failed validation; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                    failed_count=$((failed_count + 1))
                    rm -rf "$workdir"
                    continue
                  fi
                fi

                checksums_path="$asset_dir/SHA256SUMS"
                if ! gh release download "$tag" -R "$GH_REPO" --pattern SHA256SUMS --dir "$asset_dir"; then
                  echo "::warning title=Failed::$tag $target checksum asset could not be downloaded; keeping artifact for retry."
                  printf '%s\n' "- $tag $target: checksum asset could not be downloaded; will retry." >> "$GITHUB_STEP_SUMMARY"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi
                checksum_entries=$(awk -v name="$asset_name" '$2 == name { print $1 }' "$checksums_path")
                if [ "$(printf '%s\n' "$checksum_entries" | grep -c . || true)" -ne 1 ] || \
                   [ "$checksum_entries" != "$archive_sha256" ]; then
                  echo "::warning title=Failed::$tag $target checksum record does not match the trusted archive."
                  printf '%s\n' "- $tag $target: checksum record did not match the original archive; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi

                case "$archive" in
                  tar.gz)
                    if [ -f "$package_dir/LICENSE" ]; then
                      if ! tar -czf "$asset_path" -C "$package_dir" "$binary" LICENSE; then
                        echo "::warning title=Failed::$tag $target stapled package could not be created."
                        printf '%s\n' "- $tag $target: stapled package could not be created; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                        failed_count=$((failed_count + 1))
                        rm -rf "$workdir"
                        continue
                      fi
                    else
                      if ! tar -czf "$asset_path" -C "$package_dir" "$binary"; then
                        echo "::warning title=Failed::$tag $target stapled package could not be created."
                        printf '%s\n' "- $tag $target: stapled package could not be created; keeping artifact for review." >> "$GITHUB_STEP_SUMMARY"
                        failed_count=$((failed_count + 1))
                        rm -rf "$workdir"
                        continue
                      fi
                    fi
                    ;;
                  zip)
                    rm -f "$asset_path"
                    if [ -f "$package_dir/LICENSE" ]; then
                      cd "$package_dir"
                      zip -qry "$asset_path" .
                    else
                      ditto -c -k --keepParent "$binary_path" "$asset_path"
                    fi
                    ;;
                esac

                replacement_archive_sha256=$(shasum -a 256 "$asset_path" | awk '{print $1}')
                updated_checksums_path="$workdir/SHA256SUMS"
                awk -v name="$asset_name" '$2 != name { print }' "$checksums_path" > "$updated_checksums_path"
                printf '%s  %s\n' "$replacement_archive_sha256" "$asset_name" >> "$updated_checksums_path"

                if ! current_tag_sha=$(resolve_tag_commit "$tag") || \
                   [ "$current_tag_sha" != "$source_sha" ]; then
                  echo "::warning title=Skipped::$tag tag no longer points to this release run's commit."
                  printf '%s\n' "- $tag $target: tag no longer pointed to this run commit before publishing; keeping artifact." >> "$GITHUB_STEP_SUMMARY"
                  skipped_count=$((skipped_count + 1))
                  rm -rf "$workdir"
                  continue
                fi

                if ! gh release upload "$tag" -R "$GH_REPO" "$asset_path" "$updated_checksums_path" --clobber; then
                  echo "::warning title=Failed::$tag $target release upload failed; keeping artifact for retry."
                  echo "Release asset/checksum upload failed for $tag $target; keeping artifact for retry."
                  printf '%s\n' "- $tag $target: release upload failed; will retry." >> "$GITHUB_STEP_SUMMARY"
                  failed_count=$((failed_count + 1))
                  rm -rf "$workdir"
                  continue
                fi
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                accepted_count=$((accepted_count + 1))
                echo "::notice title=Completed::$tag $target completed; release asset replaced."
                echo "Completed $tag $target; release asset replaced and artifact deleted."
                printf '%s\n' "- $tag $target: notarization accepted and release asset updated." >> "$GITHUB_STEP_SUMMARY"
                ;;
              "In Progress")
                pending_count=$((pending_count + 1))
                echo "::notice title=Pending::$tag $target still pending at $checked_at."
                echo "Still pending: $tag $target at $checked_at"
                printf '%s\n' "- $tag $target: still in progress at $checked_at." >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                failed_count=$((failed_count + 1))
                echo "::warning title=Failed::$tag $target ended with terminal status $status."
                echo "Terminal notarization status for $tag $target: $status"
                printf '%s\n' "- $tag $target: terminal status $status. ${status_summary:-No summary provided.}" >> "$GITHUB_STEP_SUMMARY"
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
                ;;
            esac

            rm -rf "$workdir"
          done < "$artifacts_file"

          echo "Finalize summary: total=$total_count accepted=$accepted_count pending=$pending_count failed=$failed_count skipped=$skipped_count"
          echo "::notice title=Summary::total=$total_count accepted=$accepted_count pending=$pending_count failed=$failed_count skipped=$skipped_count"
          printf '%s\n' '' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Summary: total=$total_count accepted=$accepted_count pending=$pending_count failed=$failed_count skipped=$skipped_count" >> "$GITHUB_STEP_SUMMARY"

          if [ "$pending_count" -eq 0 ]; then
            echo "::notice title=Done::All checked notarization submissions are complete or terminal."
            echo "All checked notarization submissions are complete or terminal."
          else
            echo "::notice title=Pending::At least one notarization submission is still pending."
            echo "At least one notarization submission is still pending."
          fi
