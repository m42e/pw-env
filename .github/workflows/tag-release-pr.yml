name: Tag Release PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    name: Tag merged release
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Create repository-scoped release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # pin: v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin: v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.release-token.outputs.token }}

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          library_version=$(grep '^version' pw-env-lib/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml does not contain a numeric release version"
            exit 1
          fi
          if [ "$library_version" != "$version" ]; then
            echo "::error::Library version does not match CLI version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify branch name matches version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/v$RELEASE_VERSION"
          if [ "$RELEASE_BRANCH" != "$expected" ]; then
            echo "::error::Release branch does not match the version in Cargo.toml"
            exit 1
          fi

      - name: Verify tag does not exist
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"
            exit 1
          fi

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  cleanup:
    name: Delete closed release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event.pull_request.merged != true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin: v6.0.2
        with:
          fetch-depth: 0

      - name: Delete release branch
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$RELEASE_BRANCH"
          else
            echo "Release branch already deleted"
          fi
