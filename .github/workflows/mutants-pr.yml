name: Mutation Testing (PR)

on:
  workflow_dispatch:
    inputs:
      diff_base:
        description: Base revision for the diff (branch, tag, or commit)
        required: true
        default: origin/main
        type: string
      diff_head:
        description: Optional head revision to test and diff against (branch, tag, or commit). Defaults to the selected workflow ref.
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  list-mutants-in-diff:
    name: List Mutations in Diff
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin: v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.diff_head || github.ref }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pin: v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # pin: v2.9.1

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Fetch refs for diff resolution
        run: git fetch --force --tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Compute diff
        shell: bash
        env:
          DIFF_BASE_INPUT: ${{ inputs.diff_base || '' }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              diff_base="origin/${{ github.base_ref }}"
              ;;
            workflow_dispatch)
              diff_base="$DIFF_BASE_INPUT"
              ;;
            *)
              echo "::error::Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          if [ -z "$diff_base" ]; then
            echo "::error::diff_base is required for manual runs."
            exit 1
          fi

          git rev-parse --verify "$diff_base^{commit}" >/dev/null
          echo "Diff range: $diff_base..HEAD"
          echo "Diff range: $diff_base..HEAD" >> "$GITHUB_STEP_SUMMARY"
          git diff "$diff_base..HEAD" | tee git.diff

      - name: List mutations in diff
        run: cargo mutants --workspace --list --in-diff git.diff

  incremental-mutants:
    name: Incremental Mutation Testing (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin: v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.diff_head || github.ref }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pin: v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # pin: v2.9.1

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Fetch refs for diff resolution
        run: git fetch --force --tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Compute diff
        shell: bash
        env:
          DIFF_BASE_INPUT: ${{ inputs.diff_base || '' }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              diff_base="origin/${{ github.base_ref }}"
              ;;
            workflow_dispatch)
              diff_base="$DIFF_BASE_INPUT"
              ;;
            push)
              diff_base="HEAD^"
              ;;
            *)
              echo "::error::Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          if [ -z "$diff_base" ]; then
            echo "::error::diff_base is required for manual runs."
            exit 1
          fi

          git rev-parse --verify "$diff_base^{commit}" >/dev/null
          echo "Diff range: $diff_base..HEAD"
          echo "Diff range: $diff_base..HEAD" >> "$GITHUB_STEP_SUMMARY"
          git diff "$diff_base..HEAD" | tee git.diff

      - name: Run incremental mutation tests
        run: |
          set -euo pipefail

          # The Windows-only branches are run by windows-incremental-mutants.
          # Keep their exact source ranges out of the Linux run so uncompiled
          # cfg(windows) mutations are not reported as surviving.
          WINDOWS_ONLY_MUTANTS_RE='(pw-env-lib/src/file_io\.rs:(10[1-9]|11[0-8]|1[2-9][0-9]|2[0-3][0-9]|240|25[1-5]|26[5-9]|27[0-4]|79[7-9]|8[01][0-9]|82[0-3]|45[5-6]):|pw-env-lib/src/backend/gpg\.rs:(14[6-9]|15[0-9]|16[0-7]|18[5-9]|19[0-9]|20[0-3]|22[7-9]|2[3-9][0-9]|3[0-9][0-9]|4[0-2][0-9]|43[0-9]|45[1-9]|46[0-5]|479|48[0-9]|49[0-9]|50[0-1]|27(1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9]|6[0-9]|7[0-3])):|pw-env-lib/src/config\.rs:(1420|145[7-8]):)'

          # These cross-platform entry points have Windows-specific regression
          # tests as well. Leave them in Linux coverage and run them on Windows too.
          WINDOWS_SHARED_MUTANTS_RE='(pw-env-lib/src/file_io\.rs:244:|pw-env-lib/src/backend/gpg\.rs:(170|442|478):|pw-env-lib/src/config\.rs:(104|1321|1379|1399|1403|1434|1469):)'

          # These flag masks and decode_hex's high/low nibbles occupy disjoint
          # bits, making OR -> XOR equivalent. Exclude only these exact sites.
          EQUIVALENT_MUTANTS_RE='(pw-env-lib/src/file_io\.rs:138:43: replace \| with \^ in FileProtectionSnapshot::apply_windows_dacl|pw-env-lib/src/file_io\.rs:456:21: replace \| with \^ in create_temporary_file_with_nonce_and_dacl_access|pw-env-lib/src/backend/gpg\.rs:(149:9|155:9|161:9|200:33): replace \| with \^|pw-env-lib/src/config\.rs:1373:30: replace \| with \^ in decode_hex)'

          cargo mutants --workspace --test-tool nextest --no-shuffle -vV --baseline=skip --in-diff git.diff \
            --exclude-re "$WINDOWS_ONLY_MUTANTS_RE|$EQUIVALENT_MUTANTS_RE" \
            --minimum-test-timeout 60 --timeout 90 \
            --cargo-test-arg=--profile=mutants \
            --shard ${{ matrix.shard }}/4

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mutants-incremental-shard-${{ matrix.shard }}.out
          path: mutants.out/

  windows-incremental-mutants:
    name: Windows Mutation Testing (Shard ${{ matrix.shard }}/4)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin: v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.diff_head || github.ref }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # pin: v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # pin: v2.9.1

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Fetch refs for diff resolution
        run: git fetch --force --tags origin "+refs/heads/*:refs/remotes/origin/*"
        shell: bash

      - name: Compute diff
        shell: bash
        env:
          DIFF_BASE_INPUT: ${{ inputs.diff_base || '' }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              diff_base="origin/${{ github.base_ref }}"
              ;;
            workflow_dispatch)
              diff_base="$DIFF_BASE_INPUT"
              ;;
            push)
              diff_base="HEAD^"
              ;;
            *)
              echo "::error::Unsupported event: ${{ github.event_name }}"
              exit 1
              ;;
          esac

          if [ -z "$diff_base" ]; then
            echo "::error::diff_base is required for manual runs."
            exit 1
          fi

          git rev-parse --verify "$diff_base^{commit}" >/dev/null
          echo "Diff range: $diff_base..HEAD"
          echo "Diff range: $diff_base..HEAD" >> "$GITHUB_STEP_SUMMARY"
          git diff "$diff_base..HEAD" | tee git.diff

      - name: Run Windows-only incremental mutation tests
        shell: bash
        run: |
          set -euo pipefail

          # Run cfg(windows) code only on Windows. The line ranges distinguish
          # duplicate cfg(unix)/cfg(windows) staging helpers; update them if
          # those declarations move.
          WINDOWS_ONLY_MUTANTS_RE='(pw-env-lib/src/file_io\.rs:(10[1-9]|11[0-8]|1[2-9][0-9]|2[0-3][0-9]|240|25[1-5]|26[5-9]|27[0-4]|79[7-9]|8[01][0-9]|82[0-3]|45[5-6]):|pw-env-lib/src/backend/gpg\.rs:(14[6-9]|15[0-9]|16[0-7]|18[5-9]|19[0-9]|20[0-3]|22[7-9]|2[3-9][0-9]|3[0-9][0-9]|4[0-2][0-9]|43[0-9]|45[1-9]|46[0-5]|479|48[0-9]|49[0-9]|50[0-1]|27(1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9]|6[0-9]|7[0-3])):|pw-env-lib/src/config\.rs:(1420|145[7-8]):)'

          WINDOWS_SHARED_MUTANTS_RE='(pw-env-lib/src/file_io\.rs:244:|pw-env-lib/src/backend/gpg\.rs:(170|442|478):|pw-env-lib/src/config\.rs:(104|1321|1379|1399|1403|1434|1469):)'

          # These flag masks and decode_hex's high/low nibbles occupy disjoint
          # bits, making OR -> XOR equivalent. Exclude only these exact sites.
          EQUIVALENT_MUTANTS_RE='(pw-env-lib/src/file_io\.rs:138:43: replace \| with \^ in FileProtectionSnapshot::apply_windows_dacl|pw-env-lib/src/file_io\.rs:456:21: replace \| with \^ in create_temporary_file_with_nonce_and_dacl_access|pw-env-lib/src/backend/gpg\.rs:(149:9|155:9|161:9|200:33): replace \| with \^|pw-env-lib/src/config\.rs:1373:30: replace \| with \^ in decode_hex)'

          cargo mutants --package pw-env-lib --test-tool nextest \
            --file pw-env-lib/src/file_io.rs \
            --file pw-env-lib/src/backend/gpg.rs \
            --file pw-env-lib/src/config.rs \
            --re "$WINDOWS_ONLY_MUTANTS_RE|$WINDOWS_SHARED_MUTANTS_RE" \
            --exclude-re "$EQUIVALENT_MUTANTS_RE" \
            --no-shuffle -vV --baseline=skip --in-diff git.diff \
            --minimum-test-timeout 60 --timeout 90 \
            --cargo-test-arg=--profile=mutants \
            --cargo-test-arg windows_ \
            --shard ${{ matrix.shard }}/4

      - name: Upload Windows mutants.out
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: mutants-windows-shard-${{ matrix.shard }}.out
          path: mutants.out/
