[package]
name = "pw-env-lib"
version = "0.3.17"
edition = "2024"
description = "Library for parsing and resolving .env entries from password managers"
license = "MIT"
repository = "https://github.com/m42e/pw-env"
homepage = "https://m42e.de/pw-env/"
documentation = "https://m42e.de/pw-env/"
keywords = ["dotenv", "secrets", "password-manager"]
categories = ["config", "development-tools"]

[lib]
name = "pw_env_lib"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
anyhow = "1"
cap-std = "4.0.3"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
