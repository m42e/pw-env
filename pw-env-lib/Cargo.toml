[package]
name = "pw-env-lib"
version = "0.3.14"
edition = "2024"
description = "Library for parsing and resolving .env entries from password managers"
license = "MIT"
repository = "https://github.com/m42e/pw-env"
homepage = "https://m42e.de/pw-env/"
documentation = "https://m42e.de/pw-env/"
keywords = ["dotenv", "secrets", "password-manager"]
categories = ["config", "development-tools"]

[lib]
name = "pw_env_lib"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }